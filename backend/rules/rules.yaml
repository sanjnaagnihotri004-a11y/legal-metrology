rules:
  - rule_id: "LM-R1"
    clause: "Rule 6(1)(a)"
    title: "Manufacturer / packer / importer name and address"
    description: "Name and complete address of the manufacturer, packer or importer, including PIN code, must be declared."
    severity: "critical"
    active: true

  - rule_id: "LM-R2"
    clause: "Rule 6(1)(c)"
    title: "Net quantity declaration"
    description: "Net quantity must be declared in a standard unit of weight, measure or number."
    severity: "critical"
    active: true

  - rule_id: "LM-R3"
    clause: "Rule 6(1)(e)"
    title: "MRP declaration"
    description: "Maximum Retail Price must be declared, inclusive of all taxes."
    severity: "critical"
    active: true

  - rule_id: "LM-R4"
    clause: "Rule 6(1)(d)"
    title: "Manufacture/packing date"
    description: "Month and year of manufacture, packing or import must be declared."
    severity: "major"
    active: true

  - rule_id: "LM-R5"
    clause: "Rule 6(1)(f)"
    title: "Consumer care details"
    description: "Name, address, telephone number or email of the person to contact for consumer complaints must be declared."
    severity: "major"
    active: true

  - rule_id: "LM-R6"
    clause: "Rule 7(2)"
    title: "Net quantity numeral height"
    description: "Height of the net quantity numerals must meet the minimum prescribed for the area of the principal display panel."
    severity: "major"
    active: true

# Minimum height of numerals and letters by area of the principal display panel (Rule 7 table).
# normal_mm = normal printing, molded_mm = blown/formed/moulded text. max_area_cm2: null = no upper limit.
# SOURCE: secondary website, NOT the gazette. VERIFY every row before final submission.
font_height_table:
  - {max_area_cm2: 50,   normal_mm: 1.0, molded_mm: 2.0}
  - {max_area_cm2: 100,  normal_mm: 1.5, molded_mm: 3.0}
  - {max_area_cm2: 500,  normal_mm: 2.5, molded_mm: 4.0}
  - {max_area_cm2: 2500, normal_mm: 4.0, molded_mm: 6.0}
  - {max_area_cm2: null, normal_mm: 6.0, molded_mm: 6.0}